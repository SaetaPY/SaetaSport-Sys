    <script>
        const API_BASE = 'https://saeta-worker-api.saetasport-py.workers.dev/';
        let todosLosClientes = [];
        let todosPedidos = [];
        let ordenAscendente = true; // true = más antiguo primero, false = más reciente primero
        let ordenTotalAscendente = true; // true = menos pedidos primero, false = más pedidos primero
        let filtroFechaDesde = null; // Date o null
        let filtroFechaHasta = null; // Date o null
        
        // Cache para optimizar rendimiento
        let cacheClientes = null;
        let cachePedidos = null;
        let ultimaActualizacion = null;
        const TIEMPO_CACHE = 30000; // 30 segundos

        // Función de diagnóstico de conexión
        async function diagnosticarConexion() {
            console.log('🔍 Iniciando diagnóstico de conexión...');
            
            const resultados = {
                navegadorOnline: navigator.onLine,
                protocolo: window.location.protocol,
                apiBase: API_BASE,
                timestamp: new Date().toISOString()
            };
            
            // Probar conexión básica
            try {
                const testResponse = await fetch(API_BASE, {
                    method: 'GET',
                    cache: 'no-cache',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                resultados.conexionBasica = {
                    status: testResponse.status,
                    ok: testResponse.ok,
                    statusText: testResponse.statusText
                };
            } catch (error) {
                resultados.conexionBasica = { error: error.message };
            }
            
            console.log('📊 Resultados del diagnóstico:', resultados);
            return resultados;
        }

        // Función para probar conexión manualmente

        // Función para actualizar datos manualmente
        function actualizarDatos() {
            // Limpiar caché para forzar actualización

        // Actualizar variables de filtro de fechas desde los inputs
        function actualizarFiltroFechas() {
            const desdeStr = document.getElementById('fechaDesde')?.value || '';
            const hastaStr = document.getElementById('fechaHasta')?.value || '';

            filtroFechaDesde = desdeStr ? new Date(desdeStr + 'T00:00:00') : null;
            filtroFechaHasta = hastaStr ? new Date(hastaStr + 'T23:59:59') : null;

            if (filtroFechaDesde && filtroFechaHasta && filtroFechaDesde > filtroFechaHasta) {

            }
        }

        // Cargar todos los clientes y pedidos
        async function cargarClientes() {
            // Verificar caché
            const ahora = Date.now();
            if (cacheClientes && cachePedidos && ultimaActualizacion && 
                (ahora - ultimaActualizacion) < TIEMPO_CACHE) {
                console.log('📦 Usando datos de caché');
                todosLosClientes = cacheClientes;
                todosPedidos = cachePedidos;
                calcularEstadisticas();
                mostrarClientes(todosLosClientes);
                return;
            }
            
            mostrarLoading('Cargando datos...');
            
            try {
                console.log('🔄 Cargando datos frescos...');
                const tiempoInicio = performance.now();
                
                // Cargar usuarios registrados y pedidos en paralelo con timeout
                const fetchWithTimeout = (url, options = {}, timeout = 10000) => {
                    return Promise.race([
                        fetch(url, options),
                        new Promise((_, reject) => 
                            setTimeout(() => reject(new Error('Timeout')), timeout)
                        )
                    ]);
                };

                const [responseUsuarios, responsePedidos] = await Promise.all([
                    fetchWithTimeout(`${API_BASE}/api/usuarios`, {
                        headers: {
                            'Cache-Control': 'no-cache',
                            'Accept': 'application/json'
                        }
                    }),
                    fetchWithTimeout(`${API_BASE}/api/pedidos`, {
                        headers: {
                            'Cache-Control': 'no-cache',
                            'Accept': 'application/json'
                        }
                    })
                ]);

                // Verificar respuestas antes de procesar
                if (!responseUsuarios.ok || !responsePedidos.ok) {
                    throw new Error(`Error HTTP: Usuarios ${responseUsuarios.status}, Pedidos ${responsePedidos.status}`);
                }

                const [resultUsuarios, resultPedidos] = await Promise.all([
                    responseUsuarios.json(),
                    responsePedidos.json()
                ]);

                console.log('📊 Respuestas recibidas:', { usuarios: !!resultUsuarios, pedidos: !!resultPedidos });

                // Manejar diferentes formatos de respuesta
                const pedidosData = Array.isArray(resultPedidos) ? resultPedidos : 
                                  (resultPedidos.success ? resultPedidos.data : 
                                  (resultPedidos.data || []));
                
                const usuariosData = Array.isArray(resultUsuarios) ? resultUsuarios : 
                                   (resultUsuarios.success ? resultUsuarios.data : 
                                   (resultUsuarios.data || []));

                todosPedidos = pedidosData || [];
                
                console.log(`📦 Datos procesados: ${usuariosData.length} usuarios, ${todosPedidos.length} pedidos`);
                
                // Combinar usuarios registrados con datos de pedidos
                const clientesMap = new Map();
                
                // Primero agregar usuarios registrados formalmente
                if (usuariosData && usuariosData.length > 0) {
                    usuariosData.forEach(usuario => {
                        clientesMap.set(usuario.ci, {
                            ...usuario,
                            esUsuarioRegistrado: true
                        });
                    });
                }
                    
                    // Luego agregar/actualizar con datos de pedidos
                    todosPedidos.forEach(pedido => {
                        const ci = pedido.ci || pedido.usuario_ci;
                        if (ci) {
                            const clienteExistente = clientesMap.get(ci);
                            if (clienteExistente) {
                                // Actualizar datos si existen (priorizar datos más recientes)
                                if (pedido.nombre_completo) clienteExistente.nombre = pedido.nombre_completo;
                                if (pedido.email) clienteExistente.email = pedido.email;
                                if (pedido.telefono) clienteExistente.telefono = pedido.telefono;
                            } else {
                                // Crear cliente basado en datos del pedido
                                clientesMap.set(ci, {
                                    ci: ci,
                                    nombre: pedido.nombre_completo,
                                    email: pedido.email || '',
                                    telefono: pedido.telefono || '',
                                    fecha_registro: pedido.fecha_creacion,
                                    estado: 'activo',
                                    esUsuarioRegistrado: false
                                });
                            }
                        }
                    });

                    todosLosClientes = Array.from(clientesMap.values());
                    
                    // Guardar en caché
                    cacheClientes = [...todosLosClientes];
                    cachePedidos = [...todosPedidos];
                    ultimaActualizacion = ahora;
                    
                    // Calcular estadísticas
                    calcularEstadisticas();
                    
                    // Mostrar clientes
                    mostrarClientes(todosLosClientes);
                    
                    const tiempoFin = performance.now();
                    console.log(`✅ Datos cargados en ${Math.round(tiempoFin - tiempoInicio)}ms: ${todosLosClientes.length} clientes, ${todosPedidos.length} pedidos`);
                    
            } catch (error) {
                console.error('❌ Error completo:', error);
                
                let mensajeError = 'Error de conexión';
                
                if (error.message === 'Timeout') {
                    mensajeError = 'La conexión tardó demasiado tiempo. Verifica tu conexión a internet.';
                } else if (error.message === 'Failed to fetch') {
                    mensajeError = 'No se pudo conectar al servidor. Verifica que:\n• Tengas conexión a internet\n• El worker de Cloudflare esté funcionando\n• La URL de la API sea correcta';
                } else if (error.message.includes('HTTP')) {
                    mensajeError = 'Error del servidor: ' + error.message;
                } else {
                    mensajeError = 'Error de conexión: ' + error.message;
                }
                
                mostrarAlerta('error', mensajeError);
                
                // Mostrar estado de conexión para diagnóstico
                console.log('🔍 Información de diagnóstico:');
                console.log('API_BASE:', API_BASE);
                console.log('Navigator online:', navigator.onLine);
                console.log('Location protocol:', window.location.protocol);
                
                // Intentar mostrar datos del caché si están disponibles
                if (cacheClientes && cacheClientes.length > 0) {
                    console.log('📦 Mostrando datos del caché como fallback');
                    todosLosClientes = cacheClientes;
                    todosPedidos = cachePedidos || [];
                    calcularEstadisticas();
                    mostrarClientes(todosLosClientes);
                    mostrarAlerta('warning', 'Mostrando datos guardados (sin conexión)');
                }
            } finally {
                ocultarLoading();
            }
        }

        // Calcular estadísticas
        function calcularEstadisticas() {
            const totalClientes = todosLosClientes.length;
            const usuariosRegistrados = todosLosClientes.filter(c => c.esUsuarioRegistrado).length;
            const clientesConPedidos = new Set(todosPedidos.map(p => p.ci || p.usuario_ci)).size;

            document.getElementById('usuariosRegistrados').textContent = usuariosRegistrados;
            document.getElementById('clientesConPedidos').textContent = clientesConPedidos;

        // Imprimir lista de clientes con resumen de pedidos
        function imprimirListaClientes() {
            if (!todosLosClientes || todosLosClientes.length === 0) {
                mostrarAlerta('info', 'No hay clientes para imprimir');
                return;
            }

            // Construir mapa de pedidos por cliente
            const pedidosPorCliente = new Map();
            (todosPedidos || []).forEach(pedido => {
                const ci = pedido.ci || pedido.usuario_ci;
                if (!ci) return;
                if (!pedidosPorCliente.has(ci)) {
                    pedidosPorCliente.set(ci, []);
                }
                pedidosPorCliente.get(ci).push(pedido);
            });

            const searchInput = document.getElementById('searchInput');
            const termino = searchInput ? searchInput.value.toLowerCase() : '';

            // Aplicar mismo filtro de texto
            let clientesFiltrados = termino ?
                todosLosClientes.filter(cliente =>
                    (cliente.nombre || '').toLowerCase().includes(termino) ||
                    (cliente.ci || '').includes(termino) ||
                    (cliente.email && cliente.email.toLowerCase().includes(termino))
                ) :
                todosLosClientes;

            // Aplicar mismo filtro de fechas (si está definido)
            if (filtroFechaDesde || filtroFechaHasta) {
                clientesFiltrados = clientesFiltrados.filter(cliente => {
                    const pedidosCliente = pedidosPorCliente.get(cliente.ci) || [];
                    if (pedidosCliente.length === 0) return false;

                    return pedidosCliente.some(pedido => {
                        const fechaStr = pedido.fecha_creacion || pedido.fecha_pedido || pedido.fecha_procesamiento;
                        if (!fechaStr) return false;
                        const fecha = new Date(fechaStr);
                        if (isNaN(fecha.getTime())) return false;
                        if (filtroFechaDesde && fecha < filtroFechaDesde) return false;
                        if (filtroFechaHasta && fecha > filtroFechaHasta) return false;
                        return true;
                    });
                });
            }

            if (clientesFiltrados.length === 0) {
                mostrarAlerta('info', 'No hay clientes que cumplan con el filtro para imprimir');
                return;
            }

            // Preparar datos ordenados por nombre
            const clientesOrdenados = [...clientesFiltrados].sort((a, b) => {
                return (a.nombre || '').localeCompare(b.nombre || '');
            });

            const filasHtml = clientesOrdenados.map(cliente => {
                const pedidosCliente = pedidosPorCliente.get(cliente.ci) || [];
                const totalPedidos = pedidosCliente.length;
                const pedidosActivos = pedidosCliente.filter(p => p.estado === 'activo' && !p.completado).length;
                const pedidosCompletados = pedidosCliente.filter(p => p.completado).length;

                let ultimoPedido = 'Nunca';
                if (pedidosCliente.length > 0) {
                    const ultimo = pedidosCliente.reduce((u, actual) => {
                        const fU = new Date(u.fecha_creacion || u.fecha_pedido || '1970-01-01');
                        const fA = new Date(actual.fecha_creacion || actual.fecha_pedido || '1970-01-01');
                        return fA > fU ? actual : u;
                    });
                    const fechaObj = new Date(ultimo.fecha_creacion || ultimo.fecha_pedido);
                    if (!isNaN(fechaObj.getTime())) {
                        ultimoPedido = fechaObj.toLocaleDateString('es-ES');
                    }
                }

                return `
                    <tr>
                        <td>${cliente.nombre || ''}</td>
                        <td>${cliente.ci || ''}</td>
                        <td>${cliente.email || ''}</td>
                        <td>${cliente.telefono || ''}</td>
                        <td style="text-align:center;">${totalPedidos}</td>
                        <td style="text-align:center;">${pedidosActivos}</td>
                        <td style="text-align:center;">${pedidosCompletados}</td>
                        <td>${ultimoPedido}</td>
                    </tr>
                `;
            }).join('');

            const fechaAhora = new Date();
            const fechaTexto = fechaAhora.toLocaleString('es-ES');

            const html = `
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Listado de Clientes - Saeta</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        h1 { text-align: center; margin-bottom: 5px; }
                        .subtitulo { text-align: center; font-size: 0.9em; color: #555; margin-bottom: 20px; }
                        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
                        th, td { border: 1px solid #ccc; padding: 6px 8px; }
                        th { background: #f0f0f0; }
                        tfoot td { font-weight: bold; background: #f9f9f9; }
                        @media print {
                            button { display: none; }
                        }
                    </style>
                </head>
                <body>
                    <h1>Listado de Clientes</h1>
                    <div class="subtitulo">Generado el ${fechaTexto}</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>CI</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Total Pedidos</th>
                                <th>Activos</th>
                                <th>Completados</th>
                                <th>Último Pedido</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filasHtml}
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="4">Total clientes: ${clientesOrdenados.length}</td>
                                <td colspan="4">Total pedidos: ${(todosPedidos || []).length}</td>
                            </tr>
                        </tfoot>
                    </table>
                    <br>
                    <button onclick="window.print()">Imprimir</button>
                </body>

                mostrarAlerta('error', 'El navegador bloqueó la ventana de impresión. Habilita los pop-ups.');
                return;
            }

            ventana.document.write(html);

        // Obtener pedido completo desde la API
        async function obtenerPedidoCompleto(idPedido) {
            try {
                const response = await fetch(`${API_BASE}/api/pedidos/${idPedido}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    return result.success ? result.data : result;
                }
            } catch (error) {
                console.warn('No se pudo obtener detalle completo, usando datos locales:', error);
            }
            return null;
        }

        // Mostrar planilla completa
        async function mostrarPlanillaCompleta(pedido) {
            try {
                if (!pedido.planilla_completa) {
                    return `
                        <div class="planilla-detail">
                            <h3>📋 Planilla del Pedido</h3>
                            <p style="color: #666; font-style: italic; text-align: center; padding: 20px;">
                                No hay planilla detallada disponible para este pedido
                            </p>
                        </div>
                    `;
                }
                
                const planilla = typeof pedido.planilla_completa === 'string' 
                    ? JSON.parse(pedido.planilla_completa) 
                    : pedido.planilla_completa;
                
                if (!Array.isArray(planilla) || planilla.length === 0) {
                    return `
                        <div class="planilla-detail">
                            <h3>📋 Planilla del Pedido</h3>
                            <p style="color: #666; font-style: italic; text-align: center; padding: 20px;">
                                La planilla está vacía
                            </p>
                        </div>
                    `;
                }
                
                // Filtrar solo filas con datos
                const filasConDatos = planilla.filter(fila => 
                    fila.nombre && fila.nombre.trim() && 
                    fila.nombre.toLowerCase() !== 'nombre' && 
                    fila.nombre !== ''
                );
                
                if (filasConDatos.length === 0) {
                    return `
                        <div class="planilla-detail">
                            <h3>📋 Planilla del Pedido</h3>
                            <p style="color: #666; font-style: italic; text-align: center; padding: 20px;">
                                No hay datos de jugadores en la planilla
                            </p>
                        </div>
                    `;
                }
                
                const filasHtml = filasConDatos.map((fila, index) => `
                    <tr>
                        <td style="font-weight: 600;">${index + 1}</td>
                        <td>${fila.nombre || '-'}</td>
                        <td style="text-align: center;">${fila.numero || '-'}</td>
                        <td style="text-align: center;">${fila.talle_remera || '-'}</td>
                        <td style="text-align: center;">${fila.talle_short || '-'}</td>
                        <td style="text-align: center;">
                            ${fila.medias && fila.medias !== '' && fila.medias !== '-' && fila.medias !== 'No' ? '✅ Sí' : '❌ No'}
                        </td>
                    </tr>
                `).join('');
                
                return `
                    <div class="planilla-detail">
                        <h3>📋 Planilla Completa del Pedido (${filasConDatos.length} jugadores)</h3>
                        <div style="overflow-x: auto;">
                            <table class="planilla-table">
                                <thead>
                                    <tr>
                                        <th style="width: 50px;">#</th>
                                        <th>Nombre del Jugador</th>
                                        <th style="width: 80px;">Número</th>
                                        <th style="width: 100px;">Talle Remera</th>
                                        <th style="width: 100px;">Talle Short</th>
                                        <th style="width: 80px;">Medias</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filasHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error procesando planilla:', error);
                return `
                    <div class="planilla-detail">
                        <h3>📋 Planilla del Pedido</h3>
                        <p style="color: #dc3545; text-align: center; padding: 20px;">
                            ❌ Error al procesar la planilla: ${error.message}
                        </p>
                    </div>
                `;
            }
        }

        async function guardarComentariosAdmin(idPedido) {
            const textarea = document.getElementById('adminComments');
            const comentarios = textarea.value.trim();
            const saveBtn = document.querySelector('.btn-save');
            
            // Deshabilitar botón durante guardado
            saveBtn.disabled = true;
            saveBtn.textContent = '💾 Guardando...';
            
            try {
                // Aquí harías la llamada a tu API para guardar los comentarios
                const response = await fetch(`${API_BASE}/api/pedidos/${idPedido}/admin-comments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        admin_comentarios: comentarios
                    })
                });
                
                if (response.ok) {
                    mostrarAlerta('success', '✅ Comentarios guardados exitosamente');
                    
                    // Actualizar el pedido en el caché local
                    const pedidoIndex = todosPedidos.findIndex(p => (p.id_pedido === idPedido) || (p.id === idPedido));
                    if (pedidoIndex !== -1) {
                        todosPedidos[pedidoIndex].admin_comentarios = comentarios;
                    }
                } else {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                console.error('Error guardando comentarios:', error);
                mostrarAlerta('error', `❌ Error al guardar comentarios: ${error.message}`);
            } finally {
                // Rehabilitar botón
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Guardar Comentarios';
            }
        }

        // Cerrar modal al hacer clic fuera de él
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('pedidosModal');
            if (e.target === modal) {
                cerrarModalPedidos();
            }
        });

        // Cerrar modal con tecla Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarModalPedidos();
                cerrarModalDetalle();
            }
        });

        // Función para limpiar caché y forzar recarga
        function actualizarDatos() {
            console.log('🔄 Limpiando caché y recargando datos...');
            cacheClientes = null;
            cachePedidos = null;
            ultimaActualizacion = null;
            cargarClientes();
        }

        // Auto-actualizar cada 5 minutos si la página está activa
        setInterval(() => {
            if (!document.hidden) {
                actualizarDatos();
            }
        }, 300000); // 5 minutos

        // Funciones para modal de detalle del pedido (legacy - usar mostrarDetallePedido)
        async function verDetalle(idPedido) {
            await verDetallePedido(idPedido, 'Cliente');
        }

        function cerrarModalDetalle() {
            document.getElementById('detalleModal').style.display = 'none';
        }

        function editarPedidoEnAdmin(idPedido) {
            window.location.href = `planilla-usuario.html?id_pedido=${idPedido}`;
        }

        function verPedidoEnAdmin(idPedido, nombreCliente) {
            window.location.href = `admin.html?pedido=${idPedido}&cliente=${encodeURIComponent(nombreCliente)}`;
        }

        // Funciones auxiliares del admin
        function parsearCantidades(pedido) {
            let remeras = 0, shorts = 0, medias = 0;
            
            try {
                if (pedido.planilla_completa) {
                    const planilla = typeof pedido.planilla_completa === 'string' 
                        ? JSON.parse(pedido.planilla_completa) 
                        : pedido.planilla_completa;
                    
                    planilla.forEach(fila => {
                        if (fila.talle && fila.talle !== '' && fila.talle !== '-') remeras++;
                        if (fila.short && fila.short !== '' && fila.short !== '-') shorts++;
                        if (fila.medias && fila.medias !== '' && fila.medias !== '-' && fila.medias !== 'No') medias++;
                    });
                } else {
                    // Fallback a campos legacy
                    remeras = parseInt(pedido.cantidad_remeras) || 0;
                    shorts = parseInt(pedido.cantidad_shorts) || 0;
                    medias = parseInt(pedido.cantidad_medias) || 0;
                }
            } catch (e) {
                console.warn('Error parseando cantidades:', e);
                remeras = parseInt(pedido.cantidad_remeras) || 0;
                shorts = parseInt(pedido.cantidad_shorts) || 0;
                medias = parseInt(pedido.cantidad_medias) || 0;
            }
            
            return { remeras, shorts, medias };
        }

        function getClub(pedido) {
            return pedido.club || pedido.equipo || 'No especificado';
        }

        function getFechaEntrega(pedido) {
            const fecha = pedido.fecha_entrega;
            if (!fecha) return 'No especificada';
            
            try {
                return new Date(fecha).toLocaleDateString('es-ES');
            } catch (e) {
                return fecha;
            }
        }

        // Función para ordenar por último pedido
        function ordenarPorUltimoPedido() {
            // Cambiar el orden
            ordenAscendente = !ordenAscendente;
            
            // Resetear el icono de total pedidos
            const sortIconTotal = document.getElementById('sortIconTotal');
            sortIconTotal.className = 'sort-icon';
            sortIconTotal.textContent = '⇅';
            
            // Actualizar el icono
            const sortIcon = document.getElementById('sortIcon');
            if (ordenAscendente) {
                sortIcon.className = 'sort-icon asc';
                sortIcon.textContent = '';
            } else {
                sortIcon.className = 'sort-icon desc';
                sortIcon.textContent = '';
            }
            
            // Ordenar los clientes
            todosLosClientes.sort((a, b) => {
                // Obtener la fecha del último pedido de cada cliente
                const pedidosA = todosPedidos.filter(p => (p.ci || p.usuario_ci) === a.ci);
                const pedidosB = todosPedidos.filter(p => (p.ci || p.usuario_ci) === b.ci);
                
                // Encontrar el pedido más reciente de cada cliente
                let fechaA = null;
                let fechaB = null;
                
                if (pedidosA.length > 0) {
                    const ultimoPedidoA = pedidosA.reduce((ultimo, actual) => {
                        const fechaUltimo = new Date(ultimo.fecha_creacion || ultimo.fecha_pedido || '1970-01-01');
                        const fechaActual = new Date(actual.fecha_creacion || actual.fecha_pedido || '1970-01-01');
                        return fechaActual > fechaUltimo ? actual : ultimo;
                    });
                    fechaA = new Date(ultimoPedidoA.fecha_creacion || ultimoPedidoA.fecha_pedido || '1970-01-01');
                }
                
                if (pedidosB.length > 0) {
                    const ultimoPedidoB = pedidosB.reduce((ultimo, actual) => {
                        const fechaUltimo = new Date(ultimo.fecha_creacion || ultimo.fecha_pedido || '1970-01-01');
                        const fechaActual = new Date(actual.fecha_creacion || actual.fecha_pedido || '1970-01-01');
                        return fechaActual > fechaUltimo ? actual : ultimo;
                    });
                    fechaB = new Date(ultimoPedidoB.fecha_creacion || ultimoPedidoB.fecha_pedido || '1970-01-01');
                }
                
                // Manejar casos donde no hay pedidos
                if (!fechaA && !fechaB) return 0;
                if (!fechaA) return ordenAscendente ? -1 : 1; // Sin pedidos van al final en desc, al inicio en asc
                if (!fechaB) return ordenAscendente ? 1 : -1;
                
                // Comparar fechas
                if (ordenAscendente) {
                    return fechaA - fechaB; // Más antiguo primero
                } else {
                    return fechaB - fechaA; // Más reciente primero
                }
            });
            
            // Re-renderizar la tabla
            renderizarTablaClientes();
        }

        // Función para ordenar por total de pedidos
        function ordenarPorTotalPedidos() {
            // Cambiar el orden
            ordenTotalAscendente = !ordenTotalAscendente;
            
            // Resetear el icono de último pedido
            const sortIcon = document.getElementById('sortIcon');
            sortIcon.className = 'sort-icon';
            sortIcon.textContent = '⇅';
            
            // Actualizar el icono de total pedidos
            const sortIconTotal = document.getElementById('sortIconTotal');
            if (ordenTotalAscendente) {
                sortIconTotal.className = 'sort-icon asc';
                sortIconTotal.textContent = '';
            } else {
                sortIconTotal.className = 'sort-icon desc';
                sortIconTotal.textContent = '';
            }
            
            // Ordenar los clientes por total de pedidos
            todosLosClientes.sort((a, b) => {
                const pedidosA = todosPedidos.filter(p => (p.ci || p.usuario_ci) === a.ci);
                const pedidosB = todosPedidos.filter(p => (p.ci || p.usuario_ci) === b.ci);
                
                const totalA = pedidosA.length;
                const totalB = pedidosB.length;
                
                if (ordenTotalAscendente) {
                    return totalA - totalB; // Menos pedidos primero
                } else {
                    return totalB - totalA; // Más pedidos primero
                }
            });
            
            // Re-renderizar la tabla
            renderizarTablaClientes();
        }
    </script>
