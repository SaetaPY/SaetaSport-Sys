<head>
    <meta charset="UTF-8">

    <title>Sistema Saeta - Inicio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .logo {
            font-size: 4em;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .option-card {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 40px 30px;
            border-radius: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .option-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }

        .option-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .option-title {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .option-description {
            font-size: 1em;
            opacity: 0.9;
            line-height: 1.4;
        }

        .footer {
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
        }

        .option-card.admin-discrete {
            background: rgba(0,0,0,0.05);
            color: #666;
            padding: 8px 12px;
            font-size: 0.7em;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            border-radius: 4px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .option-card.admin-discrete:hover {
            opacity: 0.8;
            transform: none;
            box-shadow: none;
        }

        .option-card.admin-discrete .option-icon {
            font-size: 0.8em;
            margin-bottom: 2px;
        }

        .option-card.admin-discrete .option-title {
            font-size: 0.7em;
            margin-bottom: 0;
        }

        .option-card.admin-discrete .option-description {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .logo {
                font-size: 3em;
            }

            .options {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .option-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏆</div>
        <h1>Sistema Saeta</h1>
        <p class="subtitle">Gestión de Pedidos Deportivos</p>
        
        <div class="options">
            <a href="planilla.html" class="option-card">
                <span class="option-icon">📋</span>
                <div class="option-title">Nueva Planilla</div>
                <div class="option-description">
                    Crear un nuevo pedido de uniformes deportivos (acceso público)
                </div>
            </a>
            
            <a href="login-usuario.html" class="option-card">
                <span class="option-icon">👤</span>
                <div class="option-title">Mi Cuenta</div>
                <div class="option-description">
                    Acceder a mi cuenta personal y gestionar mis pedidos
                </div>
            </a>
        </div>
        
        <div class="footer">
            <p>© 2025 Sistema Saeta - Solución integral para pedidos deportivos</p>
        </div>
    </div>
    
    <!-- Panel Admin discreto -->
    <a href="login.html" class="option-card admin-discrete">
        <span class="option-icon">🔧</span>
        <div class="option-title">Admin</div>
    </a>
