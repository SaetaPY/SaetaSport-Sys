<head>

    <title>Sistema Saeta - Login Administrador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            transition: all 0.3s;

        .btn:hover {

<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h1>Acceso Admin</h1>
        <p class="subtitle">Panel de Administración</p>
        
        <div id="alerts"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ingrese su usuario">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
            </div>
            
            <button type="submit" class="btn" id="loginBtn">
                Iniciar Sesión
            </button>
        </form>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Verificando credenciales...</p>
        </div>
        
        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <script>
        // Configuración de credenciales (en producción esto debe estar en el servidor)
        const ADMIN_CREDENTIALS = {
            'admin': 'saeta2025',
            'samuel': 'admin123',
            'saeta': 'deportes2025'
        };

        // Inicializar eventos
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si ya está logueado
            if (localStorage.getItem('saeta_admin_logged') === 'true') {
                window.location.href = 'admin.html';
                return;
            }

            // Manejar envío del formulario
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                iniciarSesion();
            });

            // Focus en el primer campo
            document.getElementById('usuario').focus();
        });

        // Función para iniciar sesión
        async function iniciarSesion() {
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;
            
            if (!usuario || !password) {
                mostrarAlerta('Por favor complete todos los campos', 'error');
                return;
            }

            // Mostrar loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').textContent = 'Verificando...';

            // Simular delay de verificación (más realista)
            setTimeout(() => {
                if (ADMIN_CREDENTIALS[usuario] && ADMIN_CREDENTIALS[usuario] === password) {
                    // Login exitoso
                    localStorage.setItem('saeta_admin_logged', 'true');
                    localStorage.setItem('saeta_admin_user', usuario);
                    localStorage.setItem('saeta_admin_login_time', new Date().getTime());
                    
                    mostrarAlerta('✅ Acceso autorizado. Redirigiendo...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);
                } else {
                    // Login fallido
                    mostrarAlerta('❌ Usuario o contraseña incorrectos', 'error');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }

                // Ocultar loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').textContent = 'Iniciar Sesión';
            }, 1500);
        }

        // Mostrar alertas
        function mostrarAlerta(mensaje, tipo) {
            const alertsContainer = document.getElementById('alerts');
            alertsContainer.innerHTML = ''; // Limpiar alertas anteriores
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${tipo === 'error' ? 'error' : 'success'}`;
            alertDiv.textContent = mensaje;
            
            alertsContainer.appendChild(alertDiv);
            
            // Remover alerta después de 5 segundos
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Manejar Enter en los campos
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
